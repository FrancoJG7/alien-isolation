[Manos]
; Que las manos no atraviesen paredes. Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Cuantos metros antes de la pared se frena la mano
Margen=0.06
; Grosor de la mano: tambien se miran puntos a esta distancia alrededor (metros). 0 = solo el centro (como la v0.5)
Radio=0.05
; Tambien se mira un punto esta distancia hacia donde apunta el mando (dedos y arma). 0 = apagado
Adelante=0.12
; Si la mano frena demasiado lejos o demasiado cerca de la pared, se puede probar 0.8 o 1.2
Escala=1.0
; 1 = anota en ai_mods.log cuando frena una mano
Log=1
; Cada cuantos segundos anota
Intervalo=2.0
; Tipo de rayo del juego (no tocar)
Filtro=23
; Pared al tacto: 1 = el mando da un toquecito cuando la mano choca contra una pared, 0 = apagado
Vibrar=1
; Cuanto dura el toque (milisegundos)
VibrarMs=40
; Que tan fuerte, de 0 a 1
VibrarFuerza=0.8
; Como minimo cuantos segundos entre dos toques de la misma mano
VibrarCada=0.5
; Usar al tocar: 1 = cuando la mano toca algo (una puerta, un panel, una computadora) aprieta "usar".
; Si el juego no muestra la indicacion de usar, no pasa nada. 0 = apagado
UsarAlTocar=1
; Tecla de usar en hexa (12 = la E)
Tecla=12
; Como minimo cuantos segundos entre dos usos por tocar
UsarCada=1.0
; El toque se suelta (y puede volver a apretar usar) cuando la mano queda libre en esta parte del brazo (0.97 a 1)
SoltarToque=0.985
; ...o cuando la mano retrocede esta parte del brazo aunque siga cerca de algo (cajones arriba o abajo)
SoltarRetroceso=0.04
; ...o despues de estos segundos tocando. 0 = no se suelta por tiempo
ToqueMax=0
; Prueba: sube la mano derecha (metros). 0 = apagado
PruebaSubirDerecha=0
