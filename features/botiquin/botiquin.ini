[Botiquin]
; Curarte llevandote el botiquin al cuello: con el botiquin en la mano, lleva el mando al cuello (debajo del visor) y dejalo un momento.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Numero de la accion del juego que usa el botiquin (16 = la del boton B, la misma que prende la bengala)
Accion=16
; Tecla que aprieta, en hexa (codigo de teclado). 0 = la que tenga la accion en el juego
Tecla=0
; Que mano cuenta: -1 = cualquiera, 0 = izquierda, 1 = derecha
Mano=-1
; Zona del cuello: entre Abajo y AbajoMax metros por debajo del visor...
Abajo=0.05
AbajoMax=0.35
; ...y a menos de Radio metros de costado (si cuesta, subilo; si se activa solo, bajalo)
Radio=0.20
; Segundos que tenes que dejar la mano en el cuello
Quieto=0.20
; Segundos minimos entre una vez y la siguiente
Espera=3.0
; Cuantos segundos mantiene la tecla apretada
Mantener=0.15
; "Objeto en la mano" del botiquin, en hexa (sale en el log). 0 = lo aprende solo
Objeto=0
; 1 = si apretas B con algo en la mano y la vida sube, aprende que eso es el botiquin
Aprender=1
; Segundos entre la B y la subida de la vida para aprenderlo
Ventana=8.0
; 1 = con la vida llena no aprieta (para no gastar el botiquin)
SoloSiFalta=1
; 1 = anota los primeros bytes de cada objeto que agarras (para encontrar un numero fijo del botiquin)
Volcar=1
; 1 = vibra al curarte
Vibrar=1
; 1 = anota en ai_mods.log lo que hace
Log=1
