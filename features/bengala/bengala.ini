[Bengala]
; Prender la bengala raspandola: con la bengala en la mano, pasa la otra mano rapido por arriba del mando que la tiene.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Numero de la accion del juego que prende la bengala (la del boton B). 0 = todavia no se sabe: no aprieta nada.
; Para encontrarla: Descubrir=1, saca la bengala, apreta B y mira en ai_mods.log "descubrir: accion N recien apretada"
Accion=0
; Tecla que aprieta, en hexa (codigo de teclado). 0 = la que tenga la accion en el juego
Tecla=0
; Mano que tiene la bengala: 1 = derecha, 0 = izquierda
Mano=1
; A cuantos metros como maximo tienen que pasar los dos mandos
Radio=0.15
; Que tan rapido (m/s) tiene que pasar una mano respecto de la otra. Si cuesta, bajalo; si prende solo, subilo
Velocidad=0.8
; Segundos minimos entre un raspon y el siguiente
Espera=1.0
; Cuantos segundos mantiene la tecla apretada
Mantener=0.12
; "Objeto en la mano" de la bengala, en hexa (sale en el log). 0 = cualquier cosa que tengas en la mano
Objeto=0
; 1 = anota en ai_mods.log cada accion que apretas (para encontrar la de la bengala)
Descubrir=1
; 1 = vibra al prender
Vibrar=1
; 1 = anota en ai_mods.log lo que hace
Log=1
