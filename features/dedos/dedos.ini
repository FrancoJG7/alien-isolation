[Dedos]
; Las manos de Ripley se cierran cuando apretas el gatillo o el agarre, y se abren al soltar.
; Los cambios se toman solos con el juego abierto (1 segundo): ideal para probar los ejes en vivo.
; 1 = activado, 0 = apagado
Activado=1
; 0 = gatillo, 1 = agarre (grip), 2 = el que este mas apretado de los dos
Boton=2
; Grados que se dobla cada articulacion con la mano cerrada (0 a 120)
Angulo=70
AnguloPulgar=35
; Eje del hueso en el que se dobla: x, y o z. Con un - adelante dobla para el otro lado (-z).
; Si los dedos se van para el costado o para atras, proba otro eje o el signo.
EjeDedos=z
EjePulgar=x
; Que tan rapido sigue al boton (mas alto = mas rapido)
Velocidad=12
; Huesos de las manos en el esqueleto de Ripley (los que usa GRAND). Izquierda y derecha se deciden por el nombre
HuesoManoA=32
HuesoManoB=48
; 1 = no cierra las manos si Ripley tiene algo en la mano (arma, linterna de mano...)
SoloManosVacias=1
; 1 = anota en ai_mods.log el esqueleto y los dedos que encontro
Log=1
