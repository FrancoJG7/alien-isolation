[Pausa]
; Te sacas el visor y el juego se pausa solo (aprieta Esc una vez). Al ponertelo, la pausa la sacas vos.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Cuantos segundos tiene que estar sacado para pausar
Segundos=1
; 1 = usar el sensor de cara del visor, 0 = no
Sensor=1
; Si el visor no se mueve nada durante estos segundos, cuenta como sacado (apoyado en la mesa). 0 = no mirar esto
Quieto=2
; 1 = anota en ai_mods.log cuando te lo sacas y te lo pones
Log=1
