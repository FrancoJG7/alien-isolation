[Pisadas]
; Sentis en los mandos cada paso del alien cuando camina cerca. Mas cerca = golpe mas fuerte.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; A cuantos metros como maximo (por el camino, no en linea recta) se sienten los pasos
Distancia=12
; Cuantos metros avanza el alien por paso (mas chico = mas pasos)
Zancada=1.1
; Si el alien esta mas arriba o mas abajo que esto (metros), esta en otro piso y no se siente. 0 = siempre
AlturaMax=2.5
; Eje de la altura en el juego (no tocar salvo que te lo pida)
EjeAltura=y
; Fuerza del golpe (0 a 1): lejos y bien cerca
FuerzaMin=0.15
FuerzaMax=0.8
; Cuanto dura cada golpe (milisegundos)
Ms=28
; 1 = solo cuando el alien esta "presente" (no cuando el juego lo da por fuera, por ejemplo en los ductos)
SoloPresente=1
; 1 = anota en ai_mods.log lo que lee del alien (para ajustar)
Log=1
