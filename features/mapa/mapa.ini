[Mapa]
; Mapa en la muneca: gira la muneca izquierda hacia la cara, como para mirar la hora, y se abre el mapa. La bajas y se cierra.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Que accion del juego aprieta (38 = mapa, Tab)
Accion=38
; 0 = un toque abre y otro cierra, 1 = mantiene apretado mientras miras
Modo=0
; 0 = mano izquierda, 1 = derecha
Mano=0
; Que lado del mando tiene que mirar a tus ojos (-x = el dorso de la mano izquierda, donde va el reloj).
; Si no se abre, mira en ai_mods.log las lineas "grados hacia los ojos" con la muneca girada: usa el eje que de menos.
Eje=-x
; Cuantos grados de diferencia se aceptan
Angulo=35
; A cuantos metros de los ojos como maximo tiene que estar el mando
Distancia=0.45
; Cuantos segundos hay que sostener el gesto
Demora=0.25
; La mano tiene que estar casi quieta para abrir: mas rapida que esto (m/s) no cuenta. 0 = sin limite
VelocidadMax=0.6
; Segundos sin abrir despues de empujar con la mano hacia adelante (asi usar con la palma no abre el mapa)
Calma=1.0
; Cuantos segundos fuera del gesto para cerrar (0 = al instante). Girar la muneca rapido para afuera cierra siempre al instante
DemoraCerrar=0.03
; Cuantos grados de mas (sobre Angulo) hay que girar para que cuente como fuera del gesto
MargenAngulo=8
; Cuantos grados puede estar el reloj del centro de tu vista: hay que mirarlo de verdad, no alcanza con tener
; el dorso de la mano hacia la cara en el borde de la vista (como al mirarte los dedos). 0 = sin limite (por ejemplo 30)
MiradaMax=30
; 1 = con el mapa abierto, el stick de la otra mano (la derecha) mueve el mapa. 0 = no
StickOtraMano=1
; 1 = el stick derecho mueve el mapa suave, igual que el izquierdo. 2 = aprieta teclas (WASD, mas tosco)
StickModo=1
; Codigos de los ejes del stick (no tocar salvo que te lo pida): izquierdo x, izquierdo y, derecho x, derecho y
StickEjes=215 216 217 218
; Solo con StickModo=2: cuanto hay que inclinar el stick para que mueva (0 a 1)
ZonaMuerta=0.45
; Solo con StickModo=2: teclas que aprieta el stick (codigos del teclado en hexa: arriba izquierda abajo derecha). 11 1e 1f 20 = W A S D.
; Si con WASD no se mueve el mapa, proba las flechas: c8 cb d0 cd
TeclasMover=11 1e 1f 20
; 1 = para cerrar, solo aprieta si el juego esta en el menu (no lo reabre si lo cerraste a mano)
CerrarSoloSiMenu=1
; 1 = vibra al abrir
Vibrar=1
; 1 = anota en ai_mods.log cuando abre y cierra
Log=1
; 1 = con el mando cerca de la cara, anota los grados de cada eje (para elegir Eje). 0 cuando ya ande
LogEjes=0
