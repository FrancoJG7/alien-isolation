[Palanca]
; Bajar palancas con la mano: interactuas con la palanca (empujon o E) y en vez de apretar A, bajas la mano.
; Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; Numero de la accion del juego que baja la palanca (la que pide con la A). 12 = usar (la E)
; Si no anda, apreta la A de verdad con Descubrir=1 y mira en ai_mods.log "descubrir: accion N recien apretada"
Accion=12
; Tecla que aprieta, en hexa (codigo de teclado). 0 = la que tenga la accion en el juego
Tecla=0
; 0 = mano izquierda, 1 = derecha, 2 = cualquiera
Mano=2
; -1 = sin boton: anda unos segundos despues de cada "usar" (empujon o E). 0 = agarrando con el agarre, 1 = con A/X, 2 = con el gatillo (estos andan siempre)
Boton=-1
; Cuantos metros tiene que bajar la mano
Recorrido=0.25
; Que tan rapido (m/s) como minimo
Velocidad=0.5
; Solo con Boton=-1: cuantos segundos queda armado despues de usar, y cuantos del principio no cuentan (la mano que vuelve del empujon)
Ventana=8
Gracia=0.8
; Cuantos segundos mantiene la tecla apretada
Mantener=0.15
; 1 = anota en ai_mods.log cada accion que apretas
Descubrir=1
; 1 = vibra al bajar
Vibrar=1
; 1 = anota en ai_mods.log lo que hace
Log=1
