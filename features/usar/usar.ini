[Usar]
; Usar con la palma: estira el brazo hacia adelante, rapido, como empujando una puerta o apretando un boton, y Ripley "usa".
; Solo hace algo si el juego te muestra la indicacion de usar. Los cambios se toman solos con el juego abierto (1 segundo).
; 1 = activado, 0 = apagado
Activado=1
; 0 = mano izquierda, 1 = derecha, 2 = cualquiera
Mano=2
; Que tan rapido tiene que ir la mano hacia adelante (metros por segundo). Si no se dispara, bajalo a 0.8; si se dispara solo, subilo
Velocidad=1.0
; Cuanto tiene que estar la mano por delante de tus ojos (metros) en el empujon
Alcance=0.12
; Cuantos grados puede desviarse el movimiento hacia los costados (hacia abajo y adelante vale, para las computadoras)
Angulo=50
; Segundos minimos entre un empujon y el siguiente (ademas, la mano tiene que volver hacia vos)
Espera=0.6
; Que accion del juego aprieta (12 = usar, la E. La 17 es la R y no usa)
Accion=12
; Cuantos segundos mantiene la tecla apretada. Si algo pide "mantener" (por ejemplo una computadora), proba 0.6
Mantener=0.12
; Tecla que aprieta, en hexa (codigo de teclado). 0 = la que tenga "usar" en el juego. Con 0 usa la de la accion de arriba
Tecla=0
; 1 = vibra solo si el empujon uso algo, 2 = vibra siempre al empujar, 0 = nunca
Vibrar=1
; 1 = anota en ai_mods.log lo que hace
Log=1
; 1 = anota cada movimiento rapido de la mano (velocidad, distancia y grados) para ajustar los numeros de arriba
LogGesto=1
; 1 = busca en el juego el objeto que tenes delante y lo anota en el log (diagnostico, para tocar los objetos de verdad mas adelante)
Buscar=1
