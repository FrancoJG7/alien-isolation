[Agachar]
; Los cambios en este archivo se toman solos con el juego abierto: guarda y listo (tarda 1 segundo)
; 1 = activado, 0 = apagado (por ejemplo si jugas sentado)
Activado=1
; Cuantos metros tiene que bajar tu cabeza (respecto de parado) para agachar a Ripley
BajadaAgachar=0.25
; Por debajo de cuantos metros de bajada se vuelve a parar (tiene que ser menor que BajadaAgachar)
BajadaParar=0.12
; Cuanto tiempo (milisegundos) hay que sostener la postura antes de que cuente
DemoraMs=5
; Si bajas la cabeza mas rapido que esto (metros por segundo), agacha sin esperar la demora ni todo BajadaAgachar. 0 = apagado
Velocidad=0.8
; Cuanto tenes que haber bajado como minimo para que cuente lo rapido (metros)
BajadaRapida=0.12
; Estando agachado, cuanto tenes que subir desde lo mas bajo (rapido) para que Ripley se pare (metros)
SubidaRapida=0.15
; Tu altura de ojos parado en metros. 0 = se calcula sola mientras jugas
AlturaParado=0
; 1 = al levantarte Ripley se para sola. 0 = solo agacha, para pararte usas el boton
PararSolo=1
; 2 = medir sin el recentrado (recomendado), 1 = medir desde el piso de SteamVR
Universo=2
; 1 = MotherVR ve siempre tu cabeza a la altura de parado (saca la mirada hacia abajo al agacharte). 0 = como MotherVR original
FijarAltura=1
; 1 = anota lo de agacharse en ai_mods.log (carpeta del juego)
Log=1

[Calibrar]
; Calibrar con gesto: aprieta los dos gatillos 2 segundos y tu altura de ese momento pasa a ser "Ripley parada".
; Sirve parado o sentado: si estas sentado, agacharte es bajar la cabeza desde ahi.
; Confirma vibrando (1 toque = parado, 2 toques = sentado) y con un beep. Para volver a calibrar, solta y repeti.
; Manda sobre AlturaParado y sobre la altura que se aprende sola, y sobrevive a las recargas.
; 1 = activado, 0 = apagado
Activado=1
; Cuantos segundos hay que sostener los botones
Segundos=2
; 0 = los dos gatillos, 1 = los dos agarres (grip), por si los gatillos hacen algo en el juego
Boton=0
; Si tu cabeza esta debajo de esta altura (metros) al calibrar, cuenta como sentado (tus ojos sentado: ~1.30)
LimiteSentado=1.45
; Altura de la vista (metros) despues de calibrar, sentado o parado: asi se ve igual las dos veces.
; 1.30 = como cuando calibras sentado. Mas alto = vista mas alta. 0 = la vista sigue tu altura real (como antes)
AlturaVista=1.30
; 1 = vibra para confirmar
Vibrar=1
; 1 = solo calibra con los dos brazos extendidos hacia adelante (asi cerrar las manos por gusto no recalibra). 0 = como antes
BrazosAdelante=1
; Cuanto delante de los ojos tiene que estar cada mano (metros). Si no te calibra con los brazos estirados, baja este numero
Alcance=0.40

