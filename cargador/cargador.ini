[General]
; Tecla para apagar y volver a prender TODAS las features al instante (con el juego al frente).
; Ejemplos: ctrl+f12, f7, alt+shift+p. "no" = sin tecla
TeclaPanico=ctrl+f12
; Tecla para recargar todas las features de mods_vr sin salir del juego
TeclaRecargar=ctrl+f11
; 1 = cuando copias una feature nueva en mods_vr, cargarla sola (tarda unos 2 segundos). 0 = solo con la tecla
RecargarSolo=1
; 1 = escribe ai_mods.log en la carpeta del juego
Log=1
